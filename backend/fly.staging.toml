# Fly.io STAGING config for the backend (Free plan, $0 target: deploy.md "Staging (Fly.io Free plan)", M9-T10b).
# Deploy: `cd backend && fly deploy -c fly.staging.toml --ha=false --local-only` (one machine, built locally).
# Production uses fly.toml (unchanged). Per-environment values (URLs, origins, Neon/Redis URLs, keys) are
# `fly secrets` on this app (deploy.md §7 staging column). Public host shield-comment-api-staging.fly.dev
# = Meta/Telegram webhooks + direct calls; the apps reach it over the private network (.internal:3000).
app = "shield-comment-api-staging"
primary_region = "sin"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[deploy]
  # No release_command and no bluegreen: both start an extra machine (Free plan: 3 machines in total).
  # Migrations run before the deploy from the developer machine (deploy.md "Staging (Fly.io Free plan)").
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "::"
  LOG_LEVEL = "info"
  TRUST_PROXY_HOPS = "1"
  # Client IP = Fly-Client-IP from the edge (M9-T14a, deploy.md §2).
  TRUST_FLY_CLIENT_IP = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: Meta webhooks, BullMQ workers + schedulers run in this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health/live"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # 512 MB, not 256: the backend idles at ~170 MB RSS (local compose), too tight for 256 MB under load.
  size = "shared-cpu-1x"
  memory = "512mb"
