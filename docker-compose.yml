# ShieldComment BD — one command for the whole stack.
#   Everything:        docker compose up --build
#   Infra only (dev):  docker compose up -d postgres redis
#   Host ports: if a local Postgres/Redis already uses 5432/6379, set POSTGRES_HOST_PORT=5433 / REDIS_HOST_PORT=6380 in .env.
name: shield-comment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shield}
      POSTGRES_DB: ${POSTGRES_DB:-shield_comment}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: applies Drizzle SQL migrations (backend/drizzle) with the runtime migrator, then exits. backend waits for it.
  migrate:
    build:
      context: ./backend
      target: runtime
    command: ["node", "dist/db/migrate.js"]
    environment:
      # Prod: DIRECT_URL = Neon direct URL (migrations), DATABASE_URL = pooled (runtime). Locally both hit Docker Postgres.
      DATABASE_URL: postgresql://${POSTGRES_USER:-shield}:${POSTGRES_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_comment}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-shield}:${POSTGRES_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_comment}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shield}:${POSTGRES_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_comment}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://admin.localhost:5173,http://app.localhost:5174,http://localhost:5173,http://localhost:5174}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://admin.localhost:5173,http://app.localhost:5174,http://localhost:5173,http://localhost:5174}
      # Impersonation redirectUrl origin (same value the client uses for canonical URLs).
      CLIENT_APP_URL: ${CLIENT_PUBLIC_URL:-http://app.localhost:5174}
      # Meta connect (Module 3). Optional: no value here = passed through only when set in the root
      # .env or the shell (an empty value would fail env validation). Without them the app starts and
      # GET /api/workspaces/:id/meta/oauth/url answers 503. See backend/.env.example.
      TOKEN_ENCRYPTION_KEY:
      TOKEN_ENCRYPTION_KEY_ID:
      TOKEN_ENCRYPTION_PREVIOUS_KEYS:
      META_APP_ID:
      META_APP_SECRET:
      META_LOGIN_CONFIG_ID:
      META_OAUTH_REDIRECT_URI:
      META_GRAPH_API_VERSION:
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Admin SPA: static build served by nginx (SPA fallback) on 5173; nginx proxies same-origin /api/* to backend.
  # Open it at http://admin.localhost:5173 (host-only session cookie, tech-stack.md §4).
  admin:
    build:
      context: ./admin
      target: runtime
    environment:
      API_UPSTREAM: http://backend:3000
    ports:
      - "${ADMIN_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Client app: TanStack Start Node SSR server on 5174 (SSR landing at / and /bn, logged-in app under _app).
  # Its server route proxies same-origin /api/* to backend. Open it at http://app.localhost:5174.
  client:
    build:
      context: ./client
      target: runtime
    environment:
      API_UPSTREAM: http://backend:3000
      PUBLIC_SITE_URL: ${CLIENT_PUBLIC_URL:-http://app.localhost:5174}
    ports:
      - "${CLIENT_HOST_PORT:-5174}:5174"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
